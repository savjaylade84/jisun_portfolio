{% block content %}
    <div class="stats d-flex blackish-bg top-padding-small bottom-padding-small flex-column flex-lg-row align-items-lg-start align-items-md-center justify-content-evenly mb-3" id="statistic">

        <div class="padding-vertical-xxsmall stats-section d-flex flex-column align-items-center mb-4 mb-lg-0">
            <h4 class="text-center">Github's Trophies</h4>
            <img src="{{ information['github-readme-trophy'] }}" id="trophy" class="img-fluid mb-4" width="500" alt="">

            <h4 class="text-center">Github's Contribution Graph</h4>
            <img src="{{ information['github-contribution-graph'] }}" class="img-fluid" height="300" width="800" alt="">
        </div>

        <div class=" padding-vertical-xxsmall stats-section d-flex flex-column align-items-center mb-4 mb-lg-0">
            <h4 class="text-center">Github's Profile Stats</h4>
            <img src="{{ information['github-readme-profile-stats'] }}" class="img-fluid mb-2" width="500" alt="">
            <img src="{{ information['github-readme-streak-stats'] }}" class="img-fluid mb-4" width="500" alt="">

            <h4 class="text-center">Github's Language Stats</h4>
            <img src="{{ information['github-readme-lang-stats'] }}" class="img-fluid mb-3" width="500" alt="">

            <a href="{{ information['github-profile'] }}" target="_blank" draggable="false" role="button" class=" btn button top-margin-xxsmall button-white w-75 d-flex align-items-center justify-content-center gap-2">
                <img src="{{ url_for('static',filename=information['github-icon']) | default(information['default-img']) }}" 
                    style="background-color: black; border-radius: 100%; padding: 0.2em; object-fit: cover; vertical-align: middle;" 
                    alt="" width="28" height="28">
                Github Profile
            </a>
        </div>

    </div>
{% endblock %}
